<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta http-equiv="Pragma" content="no-cache">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f4f1eb;--bg2:#ebe7df;--card:#ffffff;--card2:#fafaf7;
  --border:#e2ded5;--border2:#d1ccc2;
  --text1:#1a2f23;--text2:#2d4a38;--text3:#5a6b5f;--text4:#8a9a8e;--text5:#b5c0b8;
  --green:#1a6b3a;--green-l:#e6f4ec;--green-d:#145530;
  --brown:#7a5230;--brown-l:#faf0e6;
  --red:#c44b3f;--red-l:#fdf0ef;
  --blue:#2a6496;--blue-l:#ebf3fa;
  --radius:10px;--shadow:0 1px 4px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;min-height:100dvh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
input,select,textarea,button{font-family:inherit;font-size:inherit}
input,select,textarea{padding:9px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text1);outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:60px}

.container{max-width:720px;margin:0 auto;padding:0 14px 80px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .3s ease}
.fade-in{animation:fadeIn .25s ease}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 18px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(26,107,58,.2)}
.btn-brown{background:var(--brown);color:#fff;box-shadow:0 2px 8px rgba(122,82,48,.2)}
.btn-outline{background:var(--card);color:var(--text3);border:1px solid var(--border2)}
.btn-danger{background:var(--red-l);color:var(--red);border:1px solid #f0d0cd}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-brown{background:var(--brown-l);color:var(--brown)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-blue{background:var(--blue-l);color:var(--blue)}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text3);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%}

.divider{height:1px;background:var(--border);margin:16px 0}

table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--text4);text-align:left;padding:8px 10px;border-bottom:2px solid var(--border)}
td{font-size:13px;padding:10px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--card2)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-box .label{font-size:11px;color:var(--text4);margin-bottom:4px}
.stat-box .value{font-size:18px;font-weight:800}
.stat-box .value.income{color:var(--green)}
.stat-box .value.expense{color:var(--red)}
.stat-box .value.balance{color:var(--blue)}

.tabs{display:flex;gap:2px;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:16px;overflow-x:auto}
.tab{flex:1;min-width:0;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--text4);border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.active{background:var(--card);color:var(--text1);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text1);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;animation:fadeIn .2s ease}

.month-bar{display:flex;align-items:flex-end;gap:3px;height:100px;margin-top:8px}
.month-bar .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.month-bar .bar{width:100%;min-height:2px;border-radius:3px 3px 0 0}
.month-bar .bar.inc{background:var(--green)}
.month-bar .bar.exp{background:var(--red);opacity:.6}
.month-bar .bar-label{font-size:9px;color:var(--text5)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.modal{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.15)}

.viewer-badge{display:inline-flex;align-items:center;gap:4px;background:#fff3cd;color:#856404;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-bottom:12px}

/* Print */
@media print {
  body{background:#fff!important}
  .no-print{display:none!important}
  .card{box-shadow:none!important;border:1px solid #ddd!important}
  .container{max-width:100%!important;padding:0!important}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================
// CONFIG
// ============================================
const SUPABASE_URL = 'https://gumjbowxihpwynruuoxu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bWpib3d4aWhwd3lucnV1b3h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MDA0MzYsImV4cCI6MjA5MDA3NjQzNn0.rh4odll0ALp-WyYEd3HvEDkUchRrVupRi4Wm5sKWBOs';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================
// STATE
// ============================================
let state = {
  user: null,       // { id, username, display_name, role }
  view: 'login',    // login | main
  tab: 'dash',
  transactions: [],
  incomeCats: [],
  expenseGroups: [],  // [{id, name, items:[{id,name}]}]
  settings: { year: 2026, carry_over: 0 },
  users: [],
  loading: true,
  toast: null,
  modal: null,
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function canEdit() {
  return state.user && (state.user.role === 'admin' || state.user.role === 'pastor');
}

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 2200);
}

// ============================================
// SESSION
// ============================================
function saveSession(u) { sessionStorage.setItem('fc_user', JSON.stringify(u)); }
function loadSession() { try { return JSON.parse(sessionStorage.getItem('fc_user')); } catch { return null; } }
function clearSession() { sessionStorage.removeItem('fc_user'); }

// ============================================
// DATA LOADING
// ============================================
async function loadAllData() {
  setState({ loading: true });
  try {
    const [trRes, icRes, egRes, eiRes, stRes] = await Promise.all([
      sb.from('finance_transactions').select('*').order('date', { ascending: false }),
      sb.from('finance_income_cats').select('*').order('sort_order'),
      sb.from('finance_expense_groups').select('*').order('sort_order'),
      sb.from('finance_expense_items').select('*').order('sort_order'),
      sb.from('finance_settings').select('*').eq('id', 1).single(),
    ]);

    const groups = (egRes.data || []).map(g => ({
      ...g,
      items: (eiRes.data || []).filter(i => i.group_id === g.id)
    }));

    setState({
      transactions: trRes.data || [],
      incomeCats: icRes.data || [],
      expenseGroups: groups,
      settings: stRes.data || { year: 2026, carry_over: 0 },
      loading: false,
    });
  } catch (e) {
    console.error(e);
    setState({ loading: false });
    showToast('데이터 로드 실패');
  }
}

async function loadUsers() {
  const { data } = await sb.from('finance_users').select('id, username, display_name, role').order('created_at');
  setState({ users: data || [] });
}

// ============================================
// HELPERS
// ============================================
function fmtN(n) { return (n || 0).toLocaleString('ko-KR'); }
function today() { return new Date().toISOString().slice(0, 10); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') e.className = v;
    else if (k === 'innerHTML') e.innerHTML = v;
    else if (k === 'htmlFor') e.htmlFor = v;
    else e.setAttribute(k, v);
  });
  children.flat(3).forEach(c => {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return e;
}

function getAllExpenseItems() {
  const items = [];
  state.expenseGroups.forEach(g => {
    g.items.forEach(it => items.push({ group: g.name, name: it.name }));
  });
  return items;
}

// ============================================
// RENDER
// ============================================
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (state.toast) {
    app.appendChild(el('div', { className: 'toast' }, state.toast));
  }

  if (state.modal) {
    app.appendChild(state.modal);
  }

  if (state.view === 'login') {
    app.appendChild(renderLogin());
  } else {
    app.appendChild(renderHeader());
    const cont = el('div', { className: 'container fade-up' });

    if (state.loading) {
      cont.appendChild(el('div', { style: { textAlign: 'center', padding: '60px 0', color: 'var(--text4)' } },
        el('div', { style: { width: '30px', height: '30px', border: '3px solid var(--border)', borderTopColor: 'var(--green)', borderRadius: '50%', animation: 'spin .8s linear infinite', margin: '0 auto 12px' } }),
        '데이터를 불러오는 중...'
      ));
    } else {
      cont.appendChild(renderTabs());
      if (state.tab === 'dash') cont.appendChild(renderDashboard());
      else if (state.tab === 'income') cont.appendChild(renderIncomeTab());
      else if (state.tab === 'expense') cont.appendChild(renderExpenseTab());
      else if (state.tab === 'ledger') cont.appendChild(renderLedgerTab());
      else if (state.tab === 'report') cont.appendChild(renderReportTab());
      else if (state.tab === 'cats') cont.appendChild(renderCatsTab());
      else if (state.tab === 'settings') cont.appendChild(renderSettingsTab());
    }

    app.appendChild(cont);
  }
}

// ============================================
// LOGIN
// ============================================
function renderLogin() {
  const wrap = el('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px', background: 'linear-gradient(150deg, #1a2f23 0%, #2d4a38 50%, #1a2f23 100%)' } });

  const box = el('div', { className: 'fade-up', style: { background: 'var(--card)', borderRadius: '16px', padding: '32px 28px', width: '100%', maxWidth: '360px', boxShadow: '0 16px 48px rgba(0,0,0,.2)' } });

  box.appendChild(el('div', { style: { textAlign: 'center', marginBottom: '28px' } },
    el('div', { style: { fontSize: '32px', marginBottom: '8px' } }, '⛪'),
    el('div', { style: { fontSize: '18px', fontWeight: '800', color: 'var(--text1)' } }, '진실한숲교회'),
    el('div', { style: { fontSize: '13px', color: 'var(--text4)', marginTop: '4px' } }, '재정관리 시스템')
  ));

  const errMsg = el('div', { style: { display: 'none', color: 'var(--red)', fontSize: '12px', textAlign: 'center', marginBottom: '10px' } });

  const idInput = el('input', { type: 'text', placeholder: '아이디', style: { width: '100%', marginBottom: '10px' } });
  const pwInput = el('input', { type: 'password', placeholder: '비밀번호', style: { width: '100%', marginBottom: '16px' } });

  const loginBtn = el('button', {
    className: 'btn btn-green btn-block',
    style: { padding: '12px' },
    onClick: async () => {
      const id = idInput.value.trim();
      const pw = pwInput.value;
      if (!id || !pw) { errMsg.textContent = '아이디와 비밀번호를 입력하세요'; errMsg.style.display = 'block'; return; }

      loginBtn.disabled = true;
      loginBtn.textContent = '로그인 중...';
      try {
        const { data, error } = await sb.rpc('finance_verify_login', { p_username: id, p_password: pw });
        if (error) throw error;
        if (data && data.length > 0) {
          const u = data[0];
          state.user = u;
          saveSession(u);
          setState({ view: 'main' });
          await loadAllData();
        } else {
          errMsg.textContent = '아이디 또는 비밀번호가 올바르지 않습니다';
          errMsg.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = '로그인';
        }
      } catch (e) {
        console.error(e);
        errMsg.textContent = '서버 연결 실패. Supabase SQL이 실행되었는지 확인하세요.';
        errMsg.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
      }
    }
  }, '로그인');

  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

  box.append(errMsg, idInput, pwInput, loginBtn);

  box.appendChild(el('div', { style: { marginTop: '20px', fontSize: '11px', color: 'var(--text5)', textAlign: 'center', lineHeight: '1.6' } },
    '기본 계정: admin / pastor / viewer', el('br'),
    '초기 비밀번호: jinsilhan2026'
  ));

  wrap.appendChild(box);
  return wrap;
}

// ============================================
// HEADER
// ============================================
function renderHeader() {
  const roleLabels = { admin: '관리자', pastor: '담임목사', viewer: '열람자' };
  const roleBadgeClass = { admin: 'badge-green', pastor: 'badge-brown', viewer: 'badge-blue' };

  return el('div', { className: 'no-print', style: { background: 'linear-gradient(135deg, #1a2f23 0%, #2d4a38 100%)', color: '#fff', padding: '14px 20px', position: 'sticky', top: '0', zIndex: '100' } },
    el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', maxWidth: '720px', margin: '0 auto' } },
      el('span', { style: { fontSize: '24px' } }, '⛪'),
      el('div', { style: { flex: '1' } },
        el('div', { style: { fontSize: '15px', fontWeight: '800', letterSpacing: '-.3px' } }, '진실한숲교회 재정관리'),
        el('div', { style: { display: 'flex', alignItems: 'center', gap: '6px', marginTop: '3px' } },
          el('span', { className: `badge ${roleBadgeClass[state.user.role]}`, style: { fontSize: '10px', padding: '2px 6px' } }, roleLabels[state.user.role]),
          el('span', { style: { fontSize: '11px', opacity: '.7' } }, state.user.display_name)
        )
      ),
      el('button', {
        className: 'btn btn-sm',
        style: { background: 'rgba(255,255,255,.15)', color: '#fff', border: 'none', fontSize: '11px' },
        onClick: () => { clearSession(); setState({ user: null, view: 'login' }); }
      }, '로그아웃')
    )
  );
}

// ============================================
// TABS
// ============================================
function renderTabs() {
  const baseTabs = [
    { k: 'dash', l: '대시보드' },
    { k: 'income', l: '수입' },
    { k: 'expense', l: '지출' },
    { k: 'ledger', l: '출납부' },
    { k: 'report', l: '보고서' },
  ];

  if (canEdit()) {
    baseTabs.push({ k: 'cats', l: '항목관리' });
    baseTabs.push({ k: 'settings', l: '설정' });
  }

  const wrap = el('div', { className: 'tabs no-print', style: { marginTop: '14px' } });
  baseTabs.forEach(t => {
    wrap.appendChild(el('div', {
      className: `tab ${state.tab === t.k ? 'active' : ''}`,
      onClick: () => setState({ tab: t.k })
    }, t.l));
  });
  return wrap;
}

// ============================================
// DASHBOARD
// ============================================
function renderDashboard() {
  const yr = state.settings.year;
  const trs = state.transactions.filter(t => t.date && t.date.startsWith(yr));
  const totalIncome = trs.filter(t => t.type === 'income').reduce((s, t) => s + (t.amount || 0), 0);
  const totalExpense = trs.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount || 0), 0);
  const balance = (state.settings.carry_over || 0) + totalIncome - totalExpense;

  const wrap = el('div');

  // Stat row
  const sr = el('div', { className: 'stat-row' });
  sr.appendChild(el('div', { className: 'stat-box' },
    el('div', { className: 'label' }, '총 수입'),
    el('div', { className: 'value income' }, fmtN(totalIncome))
  ));
  sr.appendChild(el('div', { className: 'stat-box' },
    el('div', { className: 'label' }, '총 지출'),
    el('div', { className: 'value expense' }, fmtN(totalExpense))
  ));
  sr.appendChild(el('div', { className: 'stat-box' },
    el('div', { className: 'label' }, '잔액'),
    el('div', { className: `value ${balance >= 0 ? 'balance' : 'expense'}` }, fmtN(balance))
  ));
  wrap.appendChild(sr);

  // Monthly bar chart
  const monthData = [];
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0');
    const prefix = `${yr}-${mm}`;
    const inc = trs.filter(t => t.type === 'income' && t.date.startsWith(prefix)).reduce((s, t) => s + t.amount, 0);
    const exp = trs.filter(t => t.type === 'expense' && t.date.startsWith(prefix)).reduce((s, t) => s + t.amount, 0);
    monthData.push({ m, inc, exp });
  }
  const maxVal = Math.max(1, ...monthData.map(d => Math.max(d.inc, d.exp)));

  const chartCard = el('div', { className: 'card' });
  chartCard.appendChild(el('div', { style: { fontSize: '13px', fontWeight: '700', marginBottom: '4px' } }, `${yr}년 월별 수입/지출`));
  chartCard.appendChild(el('div', { style: { fontSize: '10px', color: 'var(--text4)', marginBottom: '6px' } },
    el('span', { style: { color: 'var(--green)', fontWeight: '600' } }, '■ 수입'), '  ',
    el('span', { style: { color: 'var(--red)', fontWeight: '600' } }, '■ 지출')
  ));

  const barWrap = el('div', { className: 'month-bar' });
  monthData.forEach(d => {
    const col = el('div', { className: 'bar-col' });
    const incH = Math.max(2, (d.inc / maxVal) * 80);
    const expH = Math.max(2, (d.exp / maxVal) * 80);
    col.appendChild(el('div', { className: 'bar inc', style: { height: incH + 'px' } }));
    col.appendChild(el('div', { className: 'bar exp', style: { height: expH + 'px' } }));
    col.appendChild(el('div', { className: 'bar-label' }, d.m + ''));
    barWrap.appendChild(col);
  });
  chartCard.appendChild(barWrap);
  wrap.appendChild(chartCard);

  // Recent transactions
  const recent = state.transactions.slice(0, 10);
  if (recent.length > 0) {
    const rc = el('div', { className: 'card' });
    rc.appendChild(el('div', { style: { fontSize: '13px', fontWeight: '700', marginBottom: '10px' } }, '최근 거래'));
    const tbl = el('table');
    tbl.appendChild(el('thead', {},
      el('tr', {},
        el('th', {}, '날짜'), el('th', {}, '항목'), el('th', { style: { textAlign: 'right' } }, '금액')
      )
    ));
    const tbody = el('tbody');
    recent.forEach(t => {
      tbody.appendChild(el('tr', {},
        el('td', { style: { fontSize: '12px', color: 'var(--text3)' } }, t.date),
        el('td', {},
          el('span', { className: `badge ${t.type === 'income' ? 'badge-green' : 'badge-red'}`, style: { marginRight: '6px' } }, t.type === 'income' ? '수입' : '지출'),
          t.category + (t.sub_category ? ' > ' + t.sub_category : '')
        ),

function renderLedgerTab() {
  const wrap = el('div');
  const yr = state.settings.year;
  const trs = state.transactions.filter(t => t.date && t.date.startsWith(yr)).sort((a, b) => a.date.localeCompare(b.date));

  // Print button
  wrap.appendChild(el('div', { className: 'no-print', style: { display: 'flex', justifyContent: 'flex-end', marginBottom: '10px' } },
    el('button', { className: 'btn btn-outline btn-sm', onClick: () => window.print() }, '🖨️ 인쇄')

    card.appendChild(el('div', { style: { color: 'var(--text4)', textAlign: 'center', padding: '30px' } }, '거래 내역이 없습니다'));
    wrap.appendChild(card);
    return wrap;
  }

  const tbl = el('table');
  tbl.appendChild(el('thead', {},
    el('tr', {},
      el('th', {}, '날짜'), el('th', {}, '구분'), el('th', {}, '항목'),
      el('th', { style: { textAlign: 'right' } }, '수입'),
      el('th', { style: { textAlign: 'right' } }, '지출'),
      el('th', { style: { textAlign: 'right' } }, '잔액')
    )
  ));

  const tbody = el('tbody');
  let running = state.settings.carry_over || 0;

  // Carry-over row
  tbody.appendChild(el('tr', { style: { background: 'var(--card2)' } },
    el('td', { style: { fontSize: '12px', color: 'var(--text4)' } }, '-'),
    el('td', {}, el('span', { className: 'badge badge-blue' }, '이월')),
    el('td', {}, '전기이월금'),
    el('td', { style: { textAlign: 'right' } }, ''),
    el('td', { style: { textAlign: 'right' } }, ''),
    el('td', { style: { textAlign: 'right', fontWeight: '700' } }, fmtN(running))
  ));

  trs.forEach(t => {
    if (t.type === 'income') running += t.amount;
    else running -= t.amount;

    tbody.appendChild(el('tr', {},
      el('td', { style: { fontSize: '12px', color: 'var(--text3)' } }, t.date),
      el('td', {},
        el('span', { className: `badge ${t.type === 'income' ? 'badge-green' : 'badge-red'}` }, t.type === 'income' ? '수입' : '지출')
      ),
      el('td', {}, t.category + (t.sub_category ? ' > ' + t.sub_category : '')),
      el('td', { style: { textAlign: 'right', color: 'var(--green)', fontWeight: t.type === 'income' ? '700' : '400' } }, t.type === 'income' ? fmtN(t.amount) : ''),
      el('td', { style: { textAlign: 'right', color: 'var(--red)', fontWeight: t.type === 'expense' ? '700' : '400' } }, t.type === 'expense' ? fmtN(t.amount) : ''),
      el('td', { style: { textAlign: 'right', fontWeight: '700', color: running >= 0 ? 'var(--blue)' : 'var(--red)' } }, fmtN(running))
    ));
  });

  tbl.appendChild(tbody);
  card.appendChild(tbl);
  wrap.appendChild(card);
  return wrap;
}

// ============================================
// REPORT TAB
// ============================================
function renderReportTab() {
  const wrap = el('div');
  const yr = state.settings.year;
  const trs = state.transactions.filter(t => t.date && t.date.startsWith(yr));

  wrap.appendChild(el('div', { className: 'no-print', style: { display: 'flex', justifyContent: 'flex-end', marginBottom: '10px' } },
    el('button', { className: 'btn btn-outline btn-sm', onClick: () => window.print() }, '🖨️ 인쇄')
  ));

  // Income summary
  const incCard = el('div', { className: 'card' });
  incCard.appendChild(el('div', { style: { fontSize: '14px', fontWeight: '700', marginBottom: '12px', color: 'var(--green)' } }, `${yr}년 수입 요약`));

  const incTbl = el('table');
  incTbl.appendChild(el('thead', {}, el('tr', {}, el('th', {}, '항목'), el('th', { style: { textAlign: 'right' } }, '금액'), el('th', { style: { textAlign: 'right' } }, '비율'))));
  const incBody = el('tbody');

  const incByCat = {};
  let totalInc = 0;
  trs.filter(t => t.type === 'income').forEach(t => {
    incByCat[t.category] = (incByCat[t.category] || 0) + t.amount;
    totalInc += t.amount;
  });

  Object.entries(incByCat).sort((a, b) => b[1] - a[1]).forEach(([cat, amt]) => {
    incBody.appendChild(el('tr', {},
      el('td', {}, cat),
      el('td', { style: { textAlign: 'right', fontWeight: '600' } }, fmtN(amt) + '원'),
      el('td', { style: { textAlign: 'right', color: 'var(--text4)' } }, totalInc > 0 ? ((amt / totalInc * 100).toFixed(1) + '%') : '-')
    ));
  });
  incBody.appendChild(el('tr', { style: { background: 'var(--green-l)' } },
    el('td', { style: { fontWeight: '700' } }, '합계'),
    el('td', { style: { textAlign: 'right', fontWeight: '800', color: 'var(--green)' } }, fmtN(totalInc) + '원'),
    el('td', { style: { textAlign: 'right', fontWeight: '700' } }, '100%')
  ));
  incTbl.appendChild(incBody);
  incCard.appendChild(incTbl);
  wrap.appendChild(incCard);

  // Expense summary
  const expCard = el('div', { className: 'card' });
  expCard.appendChild(el('div', { style: { fontSize: '14px', fontWeight: '700', marginBottom: '12px', color: 'var(--red)' } }, `${yr}년 지출 요약`));

  const expTbl = el('table');
  expTbl.appendChild(el('thead', {}, el('tr', {}, el('th', {}, '분류'), el('th', {}, '세부항목'), el('th', { style: { textAlign: 'right' } }, '금액'))));
  const expBody = el('tbody');

  const expByGroup = {};
  let totalExp = 0;
  trs.filter(t => t.type === 'expense').forEach(t => {
    if (!expByGroup[t.category]) expByGroup[t.category] = {};
    const sub = t.sub_category || '기타';
    expByGroup[t.category][sub] = (expByGroup[t.category][sub] || 0) + t.amount;
    totalExp += t.amount;
  });

  Object.entries(expByGroup).forEach(([grp, subs]) => {
    const grpTotal = Object.values(subs).reduce((s, v) => s + v, 0);
    expBody.appendChild(el('tr', { style: { background: 'var(--card2)' } },
      el('td', { style: { fontWeight: '700' } }, grp),
      el('td', {}),
      el('td', { style: { textAlign: 'right', fontWeight: '700' } }, fmtN(grpTotal) + '원')
    ));
    Object.entries(subs).sort((a, b) => b[1] - a[1]).forEach(([sub, amt]) => {
      expBody.appendChild(el('tr', {},
        el('td', {}),
        el('td', { style: { paddingLeft: '16px' } }, sub),
        el('td', { style: { textAlign: 'right' } }, fmtN(amt) + '원')
      ));
    });
  });

  expBody.appendChild(el('tr', { style: { background: 'var(--red-l)' } },
    el('td', { style: { fontWeight: '700' }, colspan: '2' }, '합계'),
    el('td', {}),
    el('td', { style: { textAlign: 'right', fontWeight: '800', color: 'var(--red)' } }, fmtN(totalExp) + '원')
  ));
  incTbl.appendChild(incBody);
  expTbl.appendChild(expBody);
  expCard.appendChild(expTbl);
  wrap.appendChild(expCard);

  // Summary card
  const sumCard = el('div', { className: 'card', style: { background: 'var(--card2)' } });
  const balance = (state.settings.carry_over || 0) + totalInc - totalExp;
  sumCard.appendChild(el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' } },
    el('div', {},
      el('div', { style: { fontSize: '11px', color: 'var(--text4)' } }, '전기이월금'),
      el('div', { style: { fontSize: '16px', fontWeight: '700' } }, fmtN(state.settings.carry_over || 0) + '원')
    ),
    el('div', {},
      el('div', { style: { fontSize: '11px', color: 'var(--text4)' } }, '현재 잔액'),
      el('div', { style: { fontSize: '16px', fontWeight: '800', color: balance >= 0 ? 'var(--blue)' : 'var(--red)' } }, fmtN(balance) + '원')
    )
  ));
  wrap.appendChild(sumCard);

  return wrap;
}

      el('span', { style: { fontSize: '13px', fontWeight: '700' } }, g.name),
      el('div', { style: { display: 'flex', gap: '4px' } },
        el('button', { className: 'btn btn-outline btn-sm', style: { padding: '3px 8px', fontSize: '10px' }, onClick: () => {
          const name = prompt('추가할 세부항목 이름:');
          if (name && name.trim()) addExpenseItem(g.id, name.trim());
        }}, '+ 항목'),
        el('button', { className: 'btn btn-danger btn-sm', style: { padding: '3px 8px', fontSize: '10px' }, onClick: async () => {
          if (!confirm(`"${g.name}" 그룹을 삭제하시겠습니까? 세부항목도 모두 삭제됩니다.`)) return;
          await sb.from('finance_expense_groups').delete().eq('id', g.id);
          showToast('삭제되었습니다');
          await loadAllData();
        }}, '삭제')
      )
    ));

    g.items.forEach(it => {
      gDiv.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '5px 8px', fontSize: '12px' } },
        el('span', {}, '  ↳ ' + it.name),
        el('button', { className: 'btn btn-danger btn-sm', style: { padding: '2px 6px', fontSize: '9px' }, onClick: async () => {
          if (!confirm(`"${it.name}" 항목을 삭제하시겠습니까?`)) return;
          await sb.from('finance_expense_items').delete().eq('id', it.id);
          showToast('삭제되었습니다');
          await loadAllData();
        }}, '✕')
      ));
    });

    expCard.appendChild(gDiv);
  });
  wrap.appendChild(expCard);

  return wrap;
}

async function addIncomeCat(name) {
  const maxOrder = Math.max(0, ...state.incomeCats.map(c => c.sort_order || 0));
  await sb.from('finance_income_cats').insert({ name, sort_order: maxOrder + 1 });
  showToast('수입 항목이 추가되었습니다');
  await loadAllData();
}

async function addExpenseGroup(name) {
  const maxOrder = Math.max(0, ...state.expenseGroups.map(g => g.sort_order || 0));
  await sb.from('finance_expense_groups').insert({ name, sort_order: maxOrder + 1 });
  showToast('지출 그룹이 추가되었습니다');
  await loadAllData();
}

async function addExpenseItem(groupId, name) {
  const grp = state.expenseGroups.find(g => g.id === groupId);
  const maxOrder = grp ? Math.max(0, ...grp.items.map(i => i.sort_order || 0)) : 0;
  await sb.from('finance_expense_items').insert({ group_id: groupId, name, sort_order: maxOrder + 1 });
  showToast('세부항목이 추가되었습니다');
  await loadAllData();
}

  // General settings
  const genCard = el('div', { className: 'card' });
  genCard.appendChild(el('div', { style: { fontSize: '14px', fontWeight: '700', marginBottom: '12px' } }, '기본 설정'));

  const yearInput = el('input', { type: 'number', value: state.settings.year });
  const carryInput = el('input', { type: 'number', value: state.settings.carry_over || 0, inputmode: 'numeric' });

  genCard.append(
    el('div', { className: 'form-group' }, el('label', {}, '회계연도'), yearInput),
    el('div', { className: 'form-group' }, el('label', {}, '전기이월금 (원)'), carryInput),
    el('button', { className: 'btn btn-green btn-block', onClick: async () => {
      await sb.from('finance_settings').update({
        year: parseInt(yearInput.value) || 2026,
        carry_over: parseInt(carryInput.value) || 0,
        updated_at: new Date().toISOString()
      }).eq('id', 1);
      showToast('설정이 저장되었습니다');
      await loadAllData();
    }}, '저장')
  );
  wrap.appendChild(genCard);

  // Password change
  const pwCard = el('div', { className: 'card' });
  pwCard.appendChild(el('div', { style: { fontSize: '14px', fontWeight: '700', marginBottom: '12px' } }, '비밀번호 변경'));

  const oldPw = el('input', { type: 'password', placeholder: '현재 비밀번호' });
  const newPw = el('input', { type: 'password', placeholder: '새 비밀번호' });
  const pwErr = el('div', { style: { display: 'none', color: 'var(--red)', fontSize: '12px', marginBottom: '8px' } });

  pwCard.append(
    el('div', { className: 'form-group' }, el('label', {}, '현재 비밀번호'), oldPw),
    el('div', { className: 'form-group' }, el('label', {}, '새 비밀번호'), newPw),
    pwErr,
    el('button', { className: 'btn btn-outline btn-block', onClick: async () => {
      if (!oldPw.value || !newPw.value) { pwErr.textContent = '비밀번호를 입력하세요'; pwErr.style.display = 'block'; return; }
      const { data, error } = await sb.rpc('finance_change_password', {
        p_user_id: state.user.id, p_old_password: oldPw.value, p_new_password: newPw.value
      });
      if (data === true) {
        showToast('비밀번호가 변경되었습니다');
        oldPw.value = ''; newPw.value = '';
        pwErr.style.display = 'none';
      } else {
        pwErr.textContent = '현재 비밀번호가 일치하지 않습니다';
        pwErr.style.display = 'block';
      }
    }}, '변경')
  );
  wrap.appendChild(pwCard);

  // User management (admin only)
  if (state.user.role === 'admin' || state.user.role === 'pastor') {
    const userCard = el('div', { className: 'card' });
    userCard.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' } },
      el('div', { style: { fontSize: '14px', fontWeight: '700' } }, '계정 관리'),
      el('button', { className: 'btn btn-green btn-sm', onClick: showAddUserModal }, '+ 계정 추가')
    ));

    // Load users if not loaded
    if (state.users.length === 0) {
      loadUsers();
      userCard.appendChild(el('div', { style: { color: 'var(--text4)', fontSize: '12px' } }, '계정 목록을 불러오는 중...'));
    } else {
      const roleLabels = { admin: '관리자', pastor: '담임목사', viewer: '열람자' };
      const roleBadgeCls = { admin: 'badge-green', pastor: 'badge-brown', viewer: 'badge-blue' };

      state.users.forEach(u => {
        userCard.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid var(--border)' } },
          el('div', {},
            el('span', { style: { fontWeight: '600', fontSize: '13px' } }, u.display_name),
            el('span', { style: { fontSize: '11px', color: 'var(--text4)', marginLeft: '6px' } }, '@' + u.username),
            el('span', { className: `badge ${roleBadgeCls[u.role]}`, style: { marginLeft: '6px' } }, roleLabels[u.role])
          ),
          u.username !== state.user.username ? el('button', { className: 'btn btn-danger btn-sm', style: { padding: '3px 8px', fontSize: '10px' }, onClick: async () => {
            if (!confirm(`"${u.display_name}" 계정을 삭제하시겠습니까?`)) return;
            await sb.from('finance_users').delete().eq('id', u.id);
            showToast('삭제되었습니다');
            await loadUsers();
          }}, '삭제') : null
        ));
      });
    }
    wrap.appendChild(userCard);
  }

  return wrap;
}

function showAddUserModal() {
  const idI = el('input', { type: 'text', placeholder: '아이디 (영문)' });
  const nmI = el('input', { type: 'text', placeholder: '이름 (표시명)' });
  const pwI = el('input', { type: 'password', placeholder: '비밀번호' });
  const rlS = el('select');
  rlS.appendChild(el('option', { value: 'viewer' }, '열람자'));
  rlS.appendChild(el('option', { value: 'pastor' }, '목사'));
  rlS.appendChild(el('option', { value: 'admin' }, '관리자'));
  const msgEl = el('div', { style: { display: 'none', fontSize: '12px', marginBottom: '8px' } });

  const modal = el('div', { className: 'modal-overlay', onClick: (e) => { if (e.target === modal) { setState({ modal: null }); } } },
    el('div', { className: 'modal' },
      el('div', { style: { fontSize: '16px', fontWeight: '700', marginBottom: '16px' } }, '새 계정 추가'),
      el('div', { className: 'form-group' }, el('label', {}, '아이디'), idI),
      el('div', { className: 'form-group' }, el('label', {}, '이름'), nmI),
      el('div', { className: 'form-group' }, el('label', {}, '비밀번호'), pwI),
      el('div', { className: 'form-group' }, el('label', {}, '역할'), rlS),
      msgEl,
      el('div', { style: { display: 'flex', gap: '8px', marginTop: '8px' } },
        el('button', { className: 'btn btn-outline', style: { flex: '1' }, onClick: () => setState({ modal: null }) }, '취소'),
        el('button', { className: 'btn btn-green', style: { flex: '1' }, onClick: async () => {
          const id = idI.value.trim();
          const nm = nmI.value.trim();
          const pw = pwI.value;
          if (!id || !nm || !pw) { msgEl.textContent = '모든 항목을 입력하세요'; msgEl.style.color = 'var(--red)'; msgEl.style.display = 'block'; return; }
          try {
            const { data, error } = await sb.rpc('finance_add_user', {
              p_username: id, p_password: pw, p_display_name: nm, p_role: rlS.value
            });
            if (error) throw error;
            showToast('계정이 추가되었습니다');
            setState({ modal: null });
            await loadUsers();
          } catch (e) {
            msgEl.textContent = e.message?.includes('unique') ? '이미 존재하는 아이디입니다' : '추가 실패: ' + (e.message || '');
            msgEl.style.color = 'var(--red)';
            msgEl.style.display = 'block';
          }
        }}, '추가')
      )
    )
  );
  setState({ modal });
}

// ============================================
// INIT
// ============================================
(async function init() {
  const sess = loadSession();
  if (sess) {
    state.user = sess;
    setState({ view: 'main' });
    await loadAllData();
  } else {
    render();
  }
})();
</script>
</body>
</html>
